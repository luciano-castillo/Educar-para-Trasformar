{% extends "base.html" %}

{% block content %}

<div class="tarjeta">

    <h1>
        {{ titulo }}
    </h1>

    <p>
        Seleccione la materia, profesor,
        curso y horario correspondiente.
    </p>

    <form
        method="post"
        class="formulario"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="boton"
        >
            Guardar
        </button>

        <a
            href="{% url 'dictado_lista' %}"
            class="boton-secundario"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
