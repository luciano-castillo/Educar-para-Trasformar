[tool.ruff]

target-version = "py311"

line-length = 88

extend-exclude = [
    ".venv",
    "venv",
    "media",
    "staticfiles",
    "**/migrations/*.py",
]


[tool.ruff.lint]

select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "SIM",
]

ignore = [
    "SIM102",
    "SIM108",
]