{% extends "base.html" %}

{% block content %}

<div class="tarjeta">

    <h1>{{ titulo }}</h1>

    <p>
        Seleccione el alumno, la ruta
        y el período correspondiente.
    </p>

    <form
        method="post"
        class="formulario"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="boton"
        >
            Guardar
        </button>

        <a
            href="{% url 'transporte_contratacion_lista' %}"
            class="boton-secundario"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
